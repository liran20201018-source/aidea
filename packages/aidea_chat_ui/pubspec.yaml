name: aidea_chat_ui
description: 从 AIdea 客户端抽出的聊天界面壳。不含账号、数据库、服务端、支付或官方接口。
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 与上游 pubspec.lock 对齐的界面依赖。公式、缓存图片、相机、录音不引入。
  flutter_markdown: 0.7.6+2
  markdown: 7.3.0
  flutter_highlight: 0.7.0
  loading_animation_widget: 1.3.0
  auto_size_text: 3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: AlibabaPuHuiTi
      fonts:
        - asset: assets/fonts/AlibabaPuHuiTi-3-55-Regular.ttf
        - asset: assets/fonts/AlibabaPuHuiTi-3-85-Bold.ttf
          weight: 700
